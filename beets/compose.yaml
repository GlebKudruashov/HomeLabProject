services:
  beets:
    build: .
    image: local/beets:2.14.1
    container_name: beets
    env_file:
      - .env
    volumes:
      - ./config:/config
      - /srv/media/music:/music
      - /srv/media/inbox:/downloads
    restart: unless-stopped
    networks:
      - homelab_net
networks:
  homelab_net:
      external: true
