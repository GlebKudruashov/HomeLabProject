services:
  netbird-client:
      image: netbirdio/netbird:latest
      container_name: netbird
      hostname: myhomelab
      cap_add:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
      devices:
          # Required when using userspace mode or when kernel module is not available
          - /dev/net/tun
      network_mode: host
      env_file:
          - .env
      volumes:
          - ./netbird-client:/var/lib/netbird
      restart: unless-stopped
