services:
  npm:
    image: 'jc21/nginx-proxy-manager:2.11.3'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'     # HTTP трафик
      - '81:81'     # Веб-интерфейс админки NPM
      - '443:443'   # HTTPS трафик
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
