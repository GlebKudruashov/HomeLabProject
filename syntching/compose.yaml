services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: syncthing
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./sync:/sync
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
